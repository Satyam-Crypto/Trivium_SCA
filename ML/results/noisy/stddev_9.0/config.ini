[ML]
# How much data will be used for train, val and test. If -1, then all available data is used.
# 2^15 = 32768, 2^16 = 65536, 2^17 = 131072, 2^18 = 262144, 2 ^ 19 = 524288, 2 ^ 20 = 1048576
DatasetSize: 1048576
# Train, Val and Test are ratios which should sum to 1.0
Train: 0.625
Test: 0.25
Val: 0.125
Epochs: 50
Hidden: 128 128
Dropout: 0.0
Activation: relu
Optimizer: Adamw
BatchSize: 64
LR: 1e-4
AccuracyEps: 0
StdDev: 9.0


[OPTUNA]
# Number of trials for optimization
Trials: 500
# Epochs is fixed and is not optimized
Epochs: 25
# Train and val split ratio should sum to 1, Test has its own dataset
Train: 0.8
Val: 0.2
# Batchsize is fixed and is not optimized
BatchSize: 64
# Upper and lower bound separated by space
NumLayers: 2 5
# Upper and lower bound of layer size
LayerSize: 64 512
# Optimizer is fixed
Optimizer: adamw
# Activation is fixed
Activation: relu
# LR is fixed
LR: 1e-4
# Integer between 0 and 33
AccuracyEps: 0
